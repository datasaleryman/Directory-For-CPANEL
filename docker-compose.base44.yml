services:
  app:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
